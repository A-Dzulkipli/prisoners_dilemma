[project]
name = "ipd"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["jax", "numpy"]

[project.optional-dependencies]
test = ["pytest", "axelrod", "torch"]
# FSM, PSO gambler, ANN and attention bots read their tables/weights from axelrod (attention also needs torch)
library = ["axelrod", "torch"]

[tool.setuptools]
packages = ["ipd"]

[tool.pytest.ini_options]
markers = ["slow: big-team meta strategy checks (~45 min); run with -m slow"]
addopts = "-m 'not slow' -W ignore::SyntaxWarning"
