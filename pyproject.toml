[project]
name = "ipd"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["jax", "numpy"]

[project.optional-dependencies]
test = ["pytest", "axelrod"]
# FSM, PSO gambler, ANN and attention bots read their tables/weights from axelrod (attention also needs torch)
library = ["axelrod", "torch"]

[tool.setuptools]
packages = ["ipd"]
